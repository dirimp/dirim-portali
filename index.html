<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIRIM — Karakter Kağıdı &amp; GM Paneli</title>
  <style>
    :root {
      --bg-page: #161513;
      --bg-sheet: #f6f1e4;
      --bg-panel: #fcfaf4;
      --bg-well: #efe8d6;
      --ink-primary: #1b1a18;
      --ink-muted: #5c574f;
      --border-strong: #1b1a18;
      --border-subtle: #cfc6b2;
      --accent-active: #e7eedc;
      --accent-active-border: #2f5233;
      --radius: 4px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, rgba(246, 241, 228, 0.06), transparent 60%),
        var(--bg-page);
      color: var(--ink-primary);
      line-height: 1.4;
    }

    button,
    input,
    select,
    textarea {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .hidden {
      display: none !important;
    }

    /* GİRİŞ EKRANI */
    .auth-wrapper {
      max-width: 420px;
      margin: 48px auto;
      background: var(--bg-sheet);
      border: 2px solid var(--border-strong);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .auth-header {
      text-align: center;
      border-bottom: 2.5px solid var(--border-strong);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .auth-header h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.16em;
    }

    .auth-header p {
      margin: 4px 0 0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--ink-muted);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-error {
      background: #f5d5d0;
      color: #7f1d1d;
      border: 1.5px solid #991b1b;
      border-radius: var(--radius);
      padding: 8px 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .auth-mode-badge {
      margin-top: 14px;
      font-size: 0.76rem;
      color: var(--ink-muted);
      text-align: center;
    }

    /* ÜST ARAÇ ÇUBUĞU */
    .app-toolbar {
      max-width: 980px;
      margin: 0 auto 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      color: #efe8d6;
    }

    .app-toolbar__left {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .app-toolbar__title {
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .sync-pill {
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: #24221e;
      border: 1px solid #575248;
      color: #e6decb;
    }

    .sync-pill.live {
      border-color: #3f7a4a;
      color: #b7e4c0;
    }

    .sync-pill.saving {
      border-color: #b58928;
      color: #f5dc95;
    }

    .app-toolbar__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    select.gm-select {
      background: #24221e;
      color: #f6f1e4;
      border: 1px solid #6b6457;
      border-radius: var(--radius);
      padding: 7px 10px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    button {
      background: #24221e;
      color: #f6f1e4;
      border: 1px solid #575248;
      border-radius: var(--radius);
      padding: 7px 12px;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      background: #38352e;
      border-color: #857c6c;
    }

    button.primary {
      background: #1b1a18;
      color: #f6f1e4;
      border-color: #1b1a18;
      padding: 10px 14px;
      font-weight: 700;
    }

    button.primary:hover {
      background: #2f2d29;
    }

    button.danger:hover {
      background: #6e231d;
      border-color: #96322a;
    }

    /* GM HIZLI KART LİSTESİ */
    .gm-roster-bar {
      max-width: 980px;
      margin: 0 auto 14px;
      background: #211f1b;
      border: 1px solid #474238;
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .gm-roster-label {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #b8af9d;
      margin-right: 4px;
    }

    .gm-roster-btn {
      padding: 5px 10px;
      font-size: 0.8rem;
      background: #2c2924;
    }

    .gm-roster-btn.active {
      background: #f6f1e4;
      color: #1b1a18;
      border-color: #f6f1e4;
      font-weight: 700;
    }

    /* KARAKTER KAĞIDI */
    .sheet {
      max-width: 980px;
      margin: 0 auto;
      background: var(--bg-sheet);
      color: var(--ink-primary);
      border: 2px solid var(--border-strong);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .sheet-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: start;
      border-bottom: 2.5px solid var(--border-strong);
      padding-bottom: 18px;
      margin-bottom: 22px;
    }

    .brand-block h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.35rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand-block .sub-tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .meta-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 12px;
    }

    .field-box {
      background: var(--bg-panel);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 8px 10px;
    }

    .field-box label {
      display: block;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 4px;
    }

    .field-box input[type="text"],
    .field-box input[type="password"],
    .field-box textarea {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--ink-primary);
      font-size: 0.94rem;
      font-weight: 500;
      outline: none;
    }

    .field-box textarea {
      resize: vertical;
      min-height: 76px;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 22px;
      align-items: start;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel {
      background: var(--bg-panel);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .panel-title {
      margin: 0 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 1.5px solid var(--border-strong);
      padding-bottom: 6px;
    }

    .skills-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .skill-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 4px 8px;
      border-bottom: 1px solid var(--border-subtle);
      border-radius: 3px;
    }

    .skill-row:last-child {
      border-bottom: none;
    }

    .skill-row:hover {
      background: var(--bg-well);
    }

    .skill-name {
      font-size: 0.92rem;
      font-weight: 600;
    }

    .skill-name input.inline-skill-input {
      width: 100%;
      border: none;
      border-bottom: 1px dashed #8a8171;
      background: transparent;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink-primary);
      padding: 1px 2px;
      outline: none;
    }

    .skill-boxes {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .write-box {
      width: 40px;
      height: 24px;
      border: 1.75px solid var(--border-strong);
      border-radius: 3px;
      background: #fffdf8;
      color: var(--ink-primary);
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      padding: 0 3px;
      outline: none;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .write-box:focus {
      border-color: #000000;
      box-shadow: 0 0 0 2px rgba(27, 26, 24, 0.18);
    }

    .btn-remove-skill {
      width: 24px;
      height: 24px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-well);
      color: var(--ink-primary);
      border: 1px solid #9e9482;
      border-radius: 3px;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1;
    }

    .btn-remove-skill:hover {
      background: #f2cfca;
      color: #7f1d1d;
      border-color: #991b1b;
    }

    .extra-skill-add {
      margin-top: 8px;
      width: 100%;
      background: var(--bg-well);
      color: var(--ink-primary);
      font-weight: 600;
      border: 1px dashed #6b6457;
    }

    .extra-skill-add:hover {
      background: #e4dac2;
    }

    /* EKSTRA MODÜLÜ STİLLERİ */
    .ekstra-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ekstra-card {
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 8px 10px;
      background: var(--bg-well);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ekstra-card.active-mod {
      background: var(--accent-active);
      border-color: var(--accent-active-border);
    }

    .ekstra-top-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ekstra-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--border-strong);
      cursor: pointer;
      flex-shrink: 0;
    }

    .ekstra-title-input {
      flex: 1;
      min-width: 0;
      border: 1px solid #8a8171;
      border-radius: 3px;
      background: #fffdf8;
      padding: 4px 7px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--ink-primary);
      outline: none;
    }

    .ekstra-title-input:focus {
      border-color: var(--border-strong);
    }

    .ekstra-effects-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-left: 24px;
    }

    .ekstra-effect-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      background: var(--bg-panel);
      border: 1px solid #b5ab96;
      border-radius: 3px;
      padding: 4px 6px;
    }

    .ekstra-skill-select {
      flex: 1;
      min-width: 105px;
      border: 1px solid #8a8171;
      border-radius: 3px;
      background: #fffdf8;
      color: var(--ink-primary);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 2px 4px;
      outline: none;
    }

    .ekstra-sign-select {
      border: 1px solid #8a8171;
      border-radius: 3px;
      background: #fffdf8;
      color: var(--ink-primary);
      font-size: 0.82rem;
      font-weight: 800;
      padding: 2px 5px;
      outline: none;
      cursor: pointer;
    }

    .ekstra-amount-input {
      width: 44px;
      border: 1px solid #8a8171;
      border-radius: 3px;
      background: #fffdf8;
      color: var(--ink-primary);
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      padding: 2px 3px;
      outline: none;
    }

    .ekstra-add-effect-btn {
      align-self: flex-start;
      margin-left: 24px;
      padding: 3px 8px;
      font-size: 0.76rem;
      background: var(--bg-panel);
      color: var(--ink-primary);
      font-weight: 600;
      border: 1px solid #8a8171;
    }

    .ekstra-add-effect-btn:hover {
      background: #e4dac2;
    }

    .plugin-slot {
      border: 1.5px dashed #8a8171;
      background: var(--bg-well);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 0.8rem;
      color: var(--ink-muted);
    }

    @media (max-width: 820px) {
      .sheet-header {
        grid-template-columns: 1fr;
      }
      .meta-fields {
        grid-template-columns: 1fr;
      }
      .sheet-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body {
        background: var(--bg-sheet);
        padding: 0;
      }
      .auth-wrapper,
      .app-toolbar,
      .gm-roster-bar,
      .extra-skill-add,
      .btn-remove-skill,
      .ekstra-add-effect-btn,
      .plugin-slot {
        display: none !important;
      }
      .sheet {
        box-shadow: none;
        border-radius: 0;
        padding: 12px;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <section id="auth-screen" class="auth-wrapper" aria-label="Giriş Ekranı">
    <header class="auth-header">
      <h1>DIRIM</h1>
      <p>ANOMALİ • KARAKTER PORTALI</p>
    </header>

    <form id="login-form" class="auth-form">
      <div class="field-box">
        <label for="login-username">KULLANICI ADI</label>
        <input
          type="text"
          id="login-username"
          autocomplete="username"
          placeholder="ör. oyuncu1 veya gm"
          required
        />
      </div>

      <div class="field-box">
        <label for="login-password">ŞİFRE</label>
        <input
          type="password"
          id="login-password"
          autocomplete="current-password"
          placeholder="Şifreni gir..."
          required
        />
      </div>

      <div id="auth-error" class="auth-error hidden"></div>

      <button type="submit" class="primary">Giriş Yap</button>
    </form>

    <div id="auth-mode-info" class="auth-mode-badge"></div>
  </section>

  <div id="app-screen" class="hidden">
    <div class="app-toolbar">
      <div class="app-toolbar__left">
        <div class="app-toolbar__title" id="session-info">DIRIM — Karakter Kağıdı</div>
        <span id="sync-status" class="sync-pill">Yerel Mod</span>
      </div>

      <div class="app-toolbar__actions">
        <select id="gm-character-select" class="gm-select hidden" aria-label="Oyuncu karakteri seç">
          <option value="">Karakter seç...</option>
        </select>
        <button type="button" id="btn-export-json">JSON İndir</button>
        <button type="button" id="btn-import-json">JSON Yükle</button>
        <input type="file" id="json-file-input" accept="application/json" hidden />
        <button type="button" id="btn-print">Yazdır / PDF</button>
        <button type="button" class="danger" id="btn-reset">Temizle</button>
        <button type="button" id="btn-logout">Çıkış Yap</button>
      </div>
    </div>

    <div id="gm-roster-bar" class="gm-roster-bar hidden" aria-label="GM Oyuncu Listesi">
      <span class="gm-roster-label">Oyuncular:</span>
      <div id="gm-roster-buttons"></div>
    </div>

    <main class="sheet" id="character-sheet" data-app-version="0.5.1">
      <header class="sheet-header">
        <div class="brand-block">
          <h1>DIRIM</h1>
          <span class="sub-tag">ANOMALİ</span>
        </div>

        <div class="meta-fields">
          <div class="field-box">
            <label for="char-name">KARAKTER ADI</label>
            <input type="text" id="char-name" data-save="char-name" placeholder="Karakter adını gir..." />
          </div>
          <div class="field-box">
            <label for="player-name">OYUNCU ADI</label>
            <input type="text" id="player-name" data-save="player-name" placeholder="Oyuncu adını gir..." />
          </div>
        </div>
      </header>

      <div class="sheet-grid">
        <section class="column" aria-label="Yetenekler ve Ekstralar">
          <div class="panel" id="panel-skills">
            <h2 class="panel-title">YETENEKLER</h2>
            <div class="skills-list" id="skills-container"></div>
          </div>

          <div class="panel" id="panel-other-skills">
            <h2 class="panel-title">DIĞER YETENEKLER</h2>
            <div class="skills-list" id="other-skills-container"></div>
            <button type="button" class="extra-skill-add" id="btn-add-other-skill">+ Yetenek Satırı Ekle</button>
          </div>

          <div class="panel" id="panel-ekstralar">
            <h2 class="panel-title">EKSTRA</h2>
            <div class="ekstra-list" id="ekstra-container"></div>
            <button type="button" class="extra-skill-add" id="btn-add-ekstra">+ Ekstra Ekle</button>
          </div>
        </section>

        <section class="column" aria-label="Karakter Detayları">
          <div class="panel" id="panel-core-identity">
            <h2 class="panel-title">ANA KIMLIK</h2>
            <div class="field-box">
              <label for="ana-kimlik">ANA KIMLIK</label>
              <textarea id="ana-kimlik" data-save="ana-kimlik" placeholder="Ana kimlik detayları..."></textarea>
            </div>
          </div>

          <div class="panel" id="panel-anomaly">
            <h2 class="panel-title">ANOMALİ</h2>
            <div class="field-box">
              <label for="anomali">ANOMALİ</label>
              <textarea id="anomali" data-save="anomali" placeholder="Anomali özellikleri ve notları..."></textarea>
            </div>
          </div>

          <div class="panel" id="panel-trouble">
            <h2 class="panel-title">BELA</h2>
            <div class="field-box">
              <label for="bela">BELA</label>
              <textarea id="bela" data-save="bela" placeholder="Bela / dezavantaj / baskı unsurları..."></textarea>
            </div>
          </div>

          <div class="panel" id="panel-other-aspects">
            <h2 class="panel-title">DİĞER YÖNLER</h2>
            <div class="field-box">
              <label for="diger-yonler">DİĞER YÖNLER</label>
              <textarea id="diger-yonler" data-save="diger-yonler" placeholder="Diğer yönler, ekipman veya ek notlar..."></textarea>
            </div>
          </div>

          <div id="custom-modules-slot" class="plugin-slot" data-slot="future-modules">
            Modül Alanı: İleride ekleyeceğin yeni bölümler buraya veya ayrı panellere bağlanabilir.
          </div>
        </section>
      </div>
    </main>
  </div>

        { id: "aticilik", label: "Atıcılık", boxes: 1 },
        { id: "egitim", label: "Eğitim", boxes: 1 },
        { id: "kandirma", label: "Kandırma", boxes: 1 },
        { id: "suruculuk", label: "Sürücülük", boxes: 1 },
        { id: "bilim", label: "Bilim", boxes: 1 },
        { id: "gizlilik", label: "Gizlilik", boxes: 1 },
        { id: "tarih", label: "Tarih", boxes: 1 },
        { id: "teknoloji", label: "Teknoloji", boxes: 1 }
      ];

      const DEFAULT_OTHER_SKILLS = [
        { id: "diger_1", label: "", value: "" },
        { id: "diger_2", label: "", value: "" }
      ];

      const DEFAULT_EKSTRALAR = [];

      const hasCloud = Boolean(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey);

      let currentUser = null;
      let activeCharacterOwner = null;
      let saveDebounceTimer = null;
      let pollTimer = null;
      let isApplyingRemoteState = false;
      let appliedEkstraDeltas = {};

      const authScreen = document.getElementById("auth-screen");
      const appScreen = document.getElementById("app-screen");
      const loginForm = document.getElementById("login-form");
      const authError = document.getElementById("auth-error");
      const authModeInfo = document.getElementById("auth-mode-info");
      const sessionInfo = document.getElementById("session-info");
      const syncStatus = document.getElementById("sync-status");
      const gmSelect = document.getElementById("gm-character-select");
      const gmRosterBar = document.getElementById("gm-roster-bar");
      const gmRosterButtons = document.getElementById("gm-roster-buttons");
      const skillsContainer = document.getElementById("skills-container");
      const otherSkillsContainer = document.getElementById("other-skills-container");
      const ekstraContainer = document.getElementById("ekstra-container");
      const btnAddOtherSkill = document.getElementById("btn-add-other-skill");
      const btnAddEkstra = document.getElementById("btn-add-ekstra");

      authModeInfo.textContent = hasCloud
        ? "Mod: Ortak Veritabanı + Canlı Senkronizasyon Aktif"
        : "Mod: Yerel Tarayıcı";

      function sanitizeNumberString(raw) {
        const cleaned = String(raw ?? "").replace(/[^\d-]/g, "");
        if (!cleaned || cleaned === "-") return "";
        const normalized = cleaned.replace(/(?!^)-/g, "");
        return normalized === "-" ? "" : normalized;
      }

      function parseNum(val) {
        const n = parseInt(String(val ?? "").trim(), 10);
        return Number.isNaN(n) ? 0 : n;
      }

      function getRestHeaders() {
        return {
          apikey: SUPABASE_CONFIG.anonKey,
          Authorization: `Bearer ${SUPABASE_CONFIG.anonKey}`,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates,return=minimal"
        };
      }

      function setSyncStatus(text, type = "") {
        syncStatus.textContent = text;
        syncStatus.className = `sync-pill ${type}`.trim();
      }

      function getAllSelectableTargets() {
        const targets = DEFAULT_SKILLS.map((s) => ({
          boxId: `${s.id}_box_0`,
          label: s.label
        }));

        otherSkillsContainer.querySelectorAll("[data-other-skill-row]").forEach((row, idx) => {
          const id = row.dataset.otherSkillRow;
          const labelInput = row.querySelector(`[data-other-skill-label="${id}"]`);
          const box = row.querySelector(".write-box");
          if (box) {
            const name = (labelInput && labelInput.value.trim()) || `Diğer Yetenek ${idx + 1}`;
            targets.push({
              boxId: box.id,
              label: name
            });
          }
        });

        return targets;
      }

      function createNumericBox(boxId, ariaLabel, initialVal = "") {
        const input = document.createElement("input");
        input.type = "text";
        input.inputMode = "numeric";
        input.className = "write-box";
        input.id = boxId;
        input.setAttribute("aria-label", ariaLabel);
        input.value = sanitizeNumberString(initialVal);
        input.addEventListener("input", () => {
          const sanitized = sanitizeNumberString(input.value);
          if (input.value !== sanitized) {
            input.value = sanitized;
          }
          scheduleSave();
        });
        return input;
      }

      function renderFixedSkills(savedValues = {}) {
        skillsContainer.innerHTML = "";
        DEFAULT_SKILLS.forEach((skill) => {
          const row = document.createElement("div");
          row.className = "skill-row";

          const nameSpan = document.createElement("span");
          nameSpan.className = "skill-name";
          nameSpan.textContent = skill.label;

          const wrapper = document.createElement("div");
          wrapper.className = "skill-boxes";
          const valuesArr = savedValues[skill.id] || [];
          for (let i = 0; i < skill.boxes; i++) {
            wrapper.appendChild(
              createNumericBox(`${skill.id}_box_${i}`, `${skill.label} kutu ${i + 1}`, valuesArr[i] ?? "")
            );
          }

          row.appendChild(nameSpan);
          row.appendChild(wrapper);
          skillsContainer.appendChild(row);
        });
      }

      function renderOtherSkills(items = DEFAULT_OTHER_SKILLS) {
        otherSkillsContainer.innerHTML = "";
        items.forEach((item, idx) => {
          const id = item.id || `diger_${idx + 1}`;
          const singleValue =
            typeof item.value === "string"
              ? item.value
              : Array.isArray(item.values)
              ? item.values[0] ?? ""
              : "";

          const row = document.createElement("div");
          row.className = "skill-row";
          row.dataset.otherSkillRow = id;

          const nameWrap = document.createElement("div");
          nameWrap.className = "skill-name";

          const input = document.createElement("input");
          input.type = "text";
          input.className = "inline-skill-input";
          input.placeholder = "Diğer yetenek adı...";
          input.value = item.label || "";
          input.dataset.otherSkillLabel = id;
          input.addEventListener("input", () => {
            refreshEkstraTargetLabels();
            scheduleSave();
          });

          nameWrap.appendChild(input);

          const actionsWrap = document.createElement("div");
          actionsWrap.className = "skill-boxes";
          actionsWrap.appendChild(createNumericBox(`${id}_box_0`, `${id} değer kutusu`, singleValue));

          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "btn-remove-skill";
          removeBtn.title = "Satırı sil";
          removeBtn.setAttribute("aria-label", "Yetenek satırını sil");
          removeBtn.textContent = "×";
          removeBtn.addEventListener("click", () => {
            row.remove();
            refreshEkstraTargetLabels();
            scheduleSave();
          });

          actionsWrap.appendChild(removeBtn);
          row.appendChild(nameWrap);
          row.appendChild(actionsWrap);
          otherSkillsContainer.appendChild(row);
        });
      }

      function populateSkillSelect(selectEl, selectedBoxId) {
        const targets = getAllSelectableTargets();
        selectEl.innerHTML = "";
        targets.forEach((t) => {
          const opt = document.createElement("option");
          opt.value = t.boxId;
          opt.textContent = t.label;
          if (t.boxId === selectedBoxId) opt.selected = true;
          selectEl.appendChild(opt);
        });
      }

      function refreshEkstraTargetLabels() {
        ekstraContainer.querySelectorAll(".ekstra-skill-select").forEach((sel) => {
          const currentVal = sel.value;
          populateSkillSelect(sel, currentVal);
        });
      }

      function computeEkstraSignedDelta(effectRowEl) {
        const sign = effectRowEl.querySelector(".ekstra-sign-select")?.value === "-" ? -1 : 1;
        const amtInput = effectRowEl.querySelector(".ekstra-amount-input");
        const cleanAmt = sanitizeNumberString(amtInput ? amtInput.value : "1");
        const mag = Math.abs(parseNum(cleanAmt || "0"));
        return sign * mag;
      }

      function applyEkstraDeltaToBoxes(ekstraId, isChecked, effectRows) {
        const prevMap = appliedEkstraDeltas[ekstraId];
        if (prevMap) {
          Object.entries(prevMap).forEach(([boxId, prevDelta]) => {
            const box = document.getElementById(boxId);
            if (!box) return;
            const currentVal = parseNum(box.value);
            const reverted = currentVal - prevDelta;
            box.value = String(reverted);
          });
          delete appliedEkstraDeltas[ekstraId];
        }

        if (isChecked) {
          const newMap = {};
          effectRows.forEach((rowEl) => {
            const boxId = rowEl.querySelector(".ekstra-skill-select")?.value;
            if (!boxId) return;
            const box = document.getElementById(boxId);
            if (!box) return;
            const delta = computeEkstraSignedDelta(rowEl);
            const currentVal = parseNum(box.value);
            box.value = String(currentVal + delta);
            newMap[boxId] = (newMap[boxId] || 0) + delta;
          });
          appliedEkstraDeltas[ekstraId] = newMap;
        }
      }

      function createEffectRow(effectObj = {}, ekstraCardEl, ekstraId) {
        const rowEl = document.createElement("div");
        rowEl.className = "ekstra-effect-row";

        const defaultTarget = DEFAULT_SKILLS[0].id + "_box_0";
        const skillSelect = document.createElement("select");
        skillSelect.className = "ekstra-skill-select";
        populateSkillSelect(skillSelect, effectObj.targetBoxId || defaultTarget);

        const signSelect = document.createElement("select");
        signSelect.className = "ekstra-sign-select";
        signSelect.setAttribute("aria-label", "Artı veya Eksi");
        const optPlus = document.createElement("option");
        optPlus.value = "+";
        optPlus.textContent = "+";
        const optMinus = document.createElement("option");
        optMinus.value = "-";
        optMinus.textContent = "-";
        signSelect.appendChild(optPlus);
        signSelect.appendChild(optMinus);
        signSelect.value = effectObj.sign === "-" ? "-" : "+";

        const amountInput = document.createElement("input");
        amountInput.type = "text";
        amountInput.inputMode = "numeric";
        amountInput.className = "ekstra-amount-input";
        amountInput.setAttribute("aria-label", "Etki miktarı");
        amountInput.value = sanitizeNumberString(effectObj.amount ?? "1") || "1";

        const removeEffectBtn = document.createElement("button");
        removeEffectBtn.type = "button";
        removeEffectBtn.className = "btn-remove-skill";
        removeEffectBtn.title = "Yetenek etkisini kaldır";
        removeEffectBtn.textContent = "×";

        function handleEffectChange() {
          const clean = sanitizeNumberString(amountInput.value);
          if (amountInput.value !== clean) amountInput.value = clean;
          const checkbox = ekstraCardEl.querySelector(".ekstra-checkbox");
          if (checkbox && checkbox.checked) {
            const allRows = Array.from(ekstraCardEl.querySelectorAll(".ekstra-effect-row"));
            applyEkstraDeltaToBoxes(ekstraId, true, allRows);
          }
          scheduleSave();
        }

        skillSelect.addEventListener("change", handleEffectChange);
        signSelect.addEventListener("change", handleEffectChange);
        amountInput.addEventListener("input", handleEffectChange);

        removeEffectBtn.addEventListener("click", () => {
          const checkbox = ekstraCardEl.querySelector(".ekstra-checkbox");
          if (checkbox && checkbox.checked) {
            applyEkstraDeltaToBoxes(ekstraId, false, []);
            rowEl.remove();
            const remainingRows = Array.from(ekstraCardEl.querySelectorAll(".ekstra-effect-row"));
            applyEkstraDeltaToBoxes(ekstraId, true, remainingRows);
          } else {
            rowEl.remove();
          }
          scheduleSave();
        });

        rowEl.appendChild(skillSelect);
        rowEl.appendChild(signSelect);
        rowEl.appendChild(amountInput);
        rowEl.appendChild(removeEffectBtn);
        return rowEl;
      }

      function renderEkstralar(items = DEFAULT_EKSTRALAR) {
        ekstraContainer.innerHTML = "";
        appliedEkstraDeltas = {};

        items.forEach((item, idx) => {
          const ekstraId = item.id || `ekstra_${idx + 1}`;
          const card = document.createElement("div");
          card.className = "ekstra-card";
          card.dataset.ekstraId = ekstraId;

          const topRow = document.createElement("div");
          topRow.className = "ekstra-top-row";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "ekstra-checkbox";
          checkbox.checked = Boolean(item.active);
          card.classList.toggle("active-mod", checkbox.checked);

          const titleInput = document.createElement("input");
          titleInput.type = "text";
          titleInput.className = "ekstra-title-input";
          titleInput.placeholder = "Ekstra adı yaz...";
          titleInput.value = item.name || "";
          titleInput.addEventListener("input", scheduleSave);

          const removeCardBtn = document.createElement("button");
          removeCardBtn.type = "button";
          removeCardBtn.className = "btn-remove-skill";
          removeCardBtn.title = "Ekstrayı sil";
          removeCardBtn.textContent = "×";

          const effectsList = document.createElement("div");
          effectsList.className = "ekstra-effects-list";

          const effects = Array.isArray(item.effects) && item.effects.length > 0
            ? item.effects
            : [{ targetBoxId: DEFAULT_SKILLS[0].id + "_box_0", sign: "+", amount: "1" }];

          effects.forEach((eff) => {
            effectsList.appendChild(createEffectRow(eff, card, ekstraId));
          });

          const addEffectBtn = document.createElement("button");
          addEffectBtn.type = "button";
          addEffectBtn.className = "ekstra-add-effect-btn";
          addEffectBtn.textContent = "+ Yetenek Etkisi (+ / -)";
          addEffectBtn.addEventListener("click", () => {
            const newRow = createEffectRow(
              { targetBoxId: DEFAULT_SKILLS[0].id + "_box_0", sign: "+", amount: "1" },
              card,
              ekstraId
            );
            effectsList.appendChild(newRow);
            if (checkbox.checked) {
              const allRows = Array.from(effectsList.querySelectorAll(".ekstra-effect-row"));
              applyEkstraDeltaToBoxes(ekstraId, true, allRows);
            }
            scheduleSave();
          });

          checkbox.addEventListener("change", () => {
            card.classList.toggle("active-mod", checkbox.checked);
            const allRows = Array.from(effectsList.querySelectorAll(".ekstra-effect-row"));
            applyEkstraDeltaToBoxes(ekstraId, checkbox.checked, allRows);
            scheduleSave();
          });

          removeCardBtn.addEventListener("click", () => {
            if (checkbox.checked) {
              applyEkstraDeltaToBoxes(ekstraId, false, []);
            }
            card.remove();
            scheduleSave();
          });

          topRow.appendChild(checkbox);
          topRow.appendChild(titleInput);
          topRow.appendChild(removeCardBtn);

          card.appendChild(topRow);
          card.appendChild(effectsList);
          card.appendChild(addEffectBtn);
          ekstraContainer.appendChild(card);

          if (checkbox.checked) {
            const allRows = Array.from(effectsList.querySelectorAll(".ekstra-effect-row"));
            const map = {};
            allRows.forEach((r) => {
              const bId = r.querySelector(".ekstra-skill-select")?.value;
              if (!bId) return;
              map[bId] = (map[bId] || 0) + computeEkstraSignedDelta(r);
            });
            appliedEkstraDeltas[ekstraId] = map;
          }
        });
      }

      function collectEkstralarState() {
        const list = [];
        ekstraContainer.querySelectorAll(".ekstra-card").forEach((card) => {
          const id = card.dataset.ekstraId;
          const active = Boolean(card.querySelector(".ekstra-checkbox")?.checked);
          const name = card.querySelector(".ekstra-title-input")?.value || "";
          const effects = [];
          card.querySelectorAll(".ekstra-effect-row").forEach((row) => {
            const targetBoxId = row.querySelector(".ekstra-skill-select")?.value || "";
            const sign = row.querySelector(".ekstra-sign-select")?.value === "-" ? "-" : "+";
            const amount = sanitizeNumberString(row.querySelector(".ekstra-amount-input")?.value || "1") || "1";
            effects.push({ targetBoxId, sign, amount });
          });
          list.push({ id, name, active, effects });
        });
        return list;
      }

      function collectState() {
        const fields = {};
        document.querySelectorAll("[data-save]").forEach((el) => {
          fields[el.dataset.save] = el.value;
        });

        const skillValues = {};
        DEFAULT_SKILLS.forEach((skill) => {
          const arr = [];
          for (let i = 0; i < skill.boxes; i++) {
            const box = document.getElementById(`${skill.id}_box_${i}`);
            arr.push(box ? sanitizeNumberString(box.value) : "");
          }
          skillValues[skill.id] = arr;
        });

        const otherSkills = [];
        otherSkillsContainer.querySelectorAll("[data-other-skill-row]").forEach((row) => {
          const id = row.dataset.otherSkillRow;
          const labelInput = row.querySelector(`[data-other-skill-label="${id}"]`);
          const box = row.querySelector(".write-box");
          otherSkills.push({
            id,
            label: labelInput ? labelInput.value : "",
            value: box ? sanitizeNumberString(box.value) : ""
          });
        });

        return {
          version: "0.5.1",
          owner: activeCharacterOwner,
          updatedBy: currentUser?.username || "unknown",
          updatedAt: new Date().toISOString(),
          fields,
          skillValues,
          otherSkills,
          ekstralar: collectEkstralarState()
        };
      }

      function applyState(state, ownerFallback = "") {
        isApplyingRemoteState = true;
        try {
          const emptyFields = {
            "char-name": "",
            "player-name": ownerFallback,
            "ana-kimlik": "",
            "anomali": "",
            "bela": "",
            "diger-yonler": ""
          };

          const sourceFields = state && state.fields ? state.fields : emptyFields;

          document.querySelectorAll("[data-save]").forEach((el) => {
            const key = el.dataset.save;
            if (Object.prototype.hasOwnProperty.call(sourceFields, key)) {
              el.value = sourceFields[key] ?? "";
            } else {
              el.value = emptyFields[key] ?? "";
            }
          });

          renderFixedSkills(state && state.skillValues ? state.skillValues : {});
          renderOtherSkills(
            state && Array.isArray(state.otherSkills) ? state.otherSkills : DEFAULT_OTHER_SKILLS
          );
          renderEkstralar(
            state && Array.isArray(state.ekstralar) ? state.ekstralar : DEFAULT_EKSTRALAR
          );
        } finally {
          isApplyingRemoteState = false;
        }
      }

      function getLocalKey(owner) {
        return `${LOCAL_PREFIX}${owner}`;
      }

      function saveLocal(owner, state) {
        localStorage.setItem(getLocalKey(owner), JSON.stringify(state));
      }

      function loadLocal(owner) {
        const raw = localStorage.getItem(getLocalKey(owner));
        if (!raw) return null;
        try {
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      async function fetchCloudRow(owner) {
        const endpoint = `${SUPABASE_CONFIG.url}/rest/v1/${SUPABASE_CONFIG.table}?owner_username=eq.${encodeURIComponent(owner)}&select=data,updated_by,updated_at`;
        const res = await fetch(endpoint, {
          method: "GET",
          headers: getRestHeaders()
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }
        const rows = await res.json();
        return Array.isArray(rows) && rows.length > 0 ? rows[0] : null;
      }

      async function saveToCloud(owner, state) {
        if (!hasCloud || !owner) return;
        setSyncStatus("Kaydediliyor...", "saving");
        try {
          const endpoint = `${SUPABASE_CONFIG.url}/rest/v1/${SUPABASE_CONFIG.table}?on_conflict=owner_username`;
          const res = await fetch(endpoint, {
            method: "POST",
            headers: getRestHeaders(),
            body: JSON.stringify([
              {
                owner_username: owner,
                data: state,
                updated_by: currentUser?.username || owner,
                updated_at: new Date().toISOString()
              }
            ])
          });

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`HTTP ${res.status}: ${errText}`);
          }
          setSyncStatus("Canlı Senkron", "live");
        } catch (err) {
          console.error("Supabase kayıt hatası:", err);
          setSyncStatus("Kayıt Hatası");
        }
      }

      function scheduleSave() {
        if (isApplyingRemoteState || !activeCharacterOwner) return;
        const state = collectState();
        saveLocal(activeCharacterOwner, state);

        if (!hasCloud) {
          setSyncStatus("Yerel Kaydedildi");
          return;
        }

        setSyncStatus("Yazılıyor...", "saving");
        clearTimeout(saveDebounceTimer);
        saveDebounceTimer = setTimeout(() => {
          saveToCloud(activeCharacterOwner, state);
        }, 300);
      }

      function startLivePolling() {
        if (pollTimer) clearInterval(pollTimer);
        if (!hasCloud) return;

        pollTimer = setInterval(async () => {
          if (!activeCharacterOwner || !currentUser) return;
          const activeEl = document.activeElement;
          const userTyping = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA" || activeEl.tagName === "SELECT");
          if (userTyping) return;

          try {
            const row = await fetchCloudRow(activeCharacterOwner);
            if (!row || !row.data) return;
            const currentLocal = loadLocal(activeCharacterOwner);
            if (!currentLocal || currentLocal.updatedAt !== row.data.updatedAt) {
              if (row.updated_by !== currentUser.username) {
                saveLocal(activeCharacterOwner, row.data);
                applyState(row.data, activeCharacterOwner);
                setSyncStatus("Canlı Güncellendi", "live");
              }
            }
          } catch {
            // Sessizce bir sonraki turda tekrar dener
          }
        }, 2500);
      }

      async function loadCharacterSheet(owner) {
        activeCharacterOwner = owner;
        const ownerUser = PLAYER_USERS.find((u) => u.username === owner);
        const ownerLabel = ownerUser ? ownerUser.displayName : owner;

        if (currentUser.role === "gm") {
          sessionInfo.textContent = `GM: ${currentUser.displayName} → ${ownerLabel} (${owner}) Kağıdı`;
          gmSelect.value = owner;
          updateGmRosterActive(owner);
        } else {
          sessionInfo.textContent = `${currentUser.displayName} (${currentUser.username}) — Karakter Kağıdı`;
        }

        const localData = loadLocal(owner);
        applyState(localData, ownerLabel);

        if (hasCloud) {
          setSyncStatus("Yükleniyor...", "saving");
          try {
            const row = await fetchCloudRow(owner);
            if (row && row.data) {
              saveLocal(owner, row.data);
              applyState(row.data, ownerLabel);
              setSyncStatus("Canlı Senkron", "live");
            } else {
              await saveToCloud(owner, collectState());
            }
          } catch (err) {
            console.error("Supabase okuma hatası:", err);
            setSyncStatus("Bağlantı Hatası");
          }
        } else {
          setSyncStatus("Yerel Mod");
        }
      }

      function updateGmRosterActive(selectedOwner) {
        gmRosterButtons.querySelectorAll("button").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.owner === selectedOwner);
        });
      }

      function buildGmControls() {
        gmSelect.innerHTML = "";
        gmRosterButtons.innerHTML = "";

        PLAYER_USERS.forEach((player) => {
          const opt = document.createElement("option");
          opt.value = player.username;
          opt.textContent = `${player.displayName} (${player.username})`;
          gmSelect.appendChild(opt);

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "gm-roster-btn";
          btn.dataset.owner = player.username;
          btn.textContent = player.displayName;
          btn.addEventListener("click", () => {
            loadCharacterSheet(player.username);
          });
          gmRosterButtons.appendChild(btn);
        });
      }

      async function enterSession(user) {
        currentUser = user;
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username: user.username }));
        authScreen.classList.add("hidden");
        appScreen.classList.remove("hidden");

        if (user.role === "gm") {
          buildGmControls();
          gmSelect.classList.remove("hidden");
          gmRosterBar.classList.remove("hidden");
          startLivePolling();
          await loadCharacterSheet(PLAYER_USERS[0].username);
        } else {
          gmSelect.classList.add("hidden");
          gmRosterBar.classList.add("hidden");
          startLivePolling();
          await loadCharacterSheet(user.username);
        }
      }

      function logout() {
        currentUser = null;
        activeCharacterOwner = null;
        sessionStorage.removeItem(SESSION_KEY);
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
        appScreen.classList.add("hidden");
        authScreen.classList.remove("hidden");
        loginForm.reset();
        authError.classList.add("hidden");
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("login-username").value.trim().toLowerCase();
        const password = document.getElementById("login-password").value;

        const found = USERS.find(
          (u) => u.username.toLowerCase() === username && u.password === password
        );

        if (!found) {
          authError.textContent = "Kullanıcı adı veya şifre hatalı.";
          authError.classList.remove("hidden");
          return;
        }

        authError.classList.add("hidden");
        await enterSession(found);
      });

      gmSelect.addEventListener("change", (e) => {
        if (e.target.value) {
          loadCharacterSheet(e.target.value);
        }
      });

      document.getElementById("btn-logout").addEventListener("click", logout);

      document.querySelectorAll("[data-save]").forEach((el) => {
        el.addEventListener("input", scheduleSave);
      });

      btnAddOtherSkill.addEventListener("click", () => {
        const current = collectState().otherSkills;
        const nextIndex = current.length + 1;
        current.push({
          id: `diger_${nextIndex}_${Date.now()}`,
          label: "",
          value: ""
        });
        renderOtherSkills(current);
        refreshEkstraTargetLabels();
        scheduleSave();
      });

      btnAddEkstra.addEventListener("click", () => {
        const current = collectEkstralarState();
        const nextIndex = current.length + 1;
        current.push({
          id: `ekstra_${nextIndex}_${Date.now()}`,
          name: "",
          active: false,
          effects: [{ targetBoxId: DEFAULT_SKILLS[0].id + "_box_0", sign: "+", amount: "1" }]
        });
        renderEkstralar(current);
        scheduleSave();
      });

      document.getElementById("btn-print").addEventListener("click", () => {
        window.print();
      });

      document.getElementById("btn-export-json").addEventListener("click", () => {
        const dataStr = JSON.stringify(collectState(), null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const baseName =
          (document.getElementById("char-name").value || activeCharacterOwner || "dirim")
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "-");
        a.href = url;
        a.download = `${baseName}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      const fileInput = document.getElementById("json-file-input");
      document.getElementById("btn-import-json").addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            applyState(parsed, activeCharacterOwner);
            scheduleSave();
          } catch {
            alert("Geçersiz JSON dosyası.");
          }
        };
        reader.readAsText(file);
        fileInput.value = "";
      });

      document.getElementById("btn-reset").addEventListener("click", () => {
        if (!confirm("Bu karakter kağıdındaki veriler temizlensin mi?")) return;
        const ownerUser = PLAYER_USERS.find((u) => u.username === activeCharacterOwner);
        applyState(null, ownerUser ? ownerUser.displayName : activeCharacterOwner);
        scheduleSave();
      });

      const savedSessionRaw = sessionStorage.getItem(SESSION_KEY);
      if (savedSessionRaw) {
        try {
          const parsedSession = JSON.parse(savedSessionRaw);
          const match = USERS.find((u) => u.username === parsedSession.username);
          if (match) {
            enterSession(match);
          }
        } catch {
          sessionStorage.removeItem(SESSION_KEY);
        }
      }

      window.DirimSheet = {
        getState: collectState,
        setState: (newState) => {
          applyState(newState, activeCharacterOwner);
          scheduleSave();
        },
        registerModule(title, elementOrHtml) {
          const slot = document.getElementById("custom-modules-slot");
          const panel = document.createElement("div");
          panel.className = "panel";

          const h2 = document.createElement("h2");
          h2.className = "panel-title";
          h2.textContent = title;
          panel.appendChild(h2);

          if (typeof elementOrHtml === "string") {
            const body = document.createElement("div");
            body.innerHTML = elementOrHtml;
            panel.appendChild(body);
          } else if (elementOrHtml instanceof HTMLElement) {
            panel.appendChild(elementOrHtml);
          }

          slot.parentNode.insertBefore(panel, slot);
          return panel;
        }
      };
    })();
  </script>
</body>
</html>
